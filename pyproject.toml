[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-automation-agent"
version = "1.1.0"
description = "Local-first AI-SDET and client QA audit engine: crawling, UX/a11y/perf, security, API fuzzing, visual diff, self-healing locators, LLM/RAG evals, and client-ready reports."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Gaetano (v0idbrn)" }]
keywords = ["qa", "ai-sdet", "llm-evals", "mcp", "playwright", "pytest", "quality-gates"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: Pytest",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pydantic>=2.0.0",
    "playwright>=1.40.0",
    "jinja2>=3.1.0",
    "beautifulsoup4>=4.12.0",
    "httpx>=0.27.0",
    "pandas>=2.0.0",
    "pillow>=10.0.0",
]

[project.scripts]
qa-agent = "qa_agent.cli:main"

[project.optional-dependencies]
test = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[project.urls]
Repository = "https://github.com/v0idbrn/QA_Automation_Agent"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qa_agent = ["py.typed"]
