name: CI Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Pytest quality gates (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps

      - name: Check dependency consistency
        run: python -m pip check

      - name: Install Tk runtime for GUI regression tests
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run full quality-gate suite
        run: python -m pytest -q --junitxml=pytest-results.xml

      - name: Publish quality evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-evidence-py${{ matrix.python-version }}
          path: |
            cv_metrics.json
            pytest-results.xml
          if-no-files-found: warn
          retention-days: 14
